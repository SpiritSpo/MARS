name: MARS server checks
on:
  push:
    branches: [feature/server-finance-foundation]
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
  workflow_dispatch:
jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        run: npm install --no-audit --no-fund
      - name: Check server syntax
        run: |
          node --check src/index.js
          node --check src/validation.js
      - name: Run finance validation tests
        run: npm test
