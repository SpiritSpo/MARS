name: MARS server checks
on:
  push:
    branches: [feature/server-finance-foundation]
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
  workflow_dispatch:
jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mars_test
          POSTGRES_PASSWORD: mars_test
          POSTGRES_DB: mars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mars_test -d mars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        run: npm install --no-audit --no-fund
      - name: Check server syntax
        run: |
          node --check src/index.js
          node --check src/validation.js
          node --check src/finance-import.js
      - name: Run finance validation tests with PostgreSQL
        env:
          MARS_TEST_DATABASE_URL: postgres://mars_test:mars_test@localhost:5432/mars_test
        run: npm test
